name: Semantic versioning
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: semantic-version-main
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update version and tag
        id: version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          before=$(git rev-parse HEAD)
          python3 scripts/release.py
          if [ "$before" != "$(git rev-parse HEAD)" ]; then echo 'released=true' >> "$GITHUB_OUTPUT"; fi
      - name: Request Pages build for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        if: steps.version.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Publish portfolio release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          if [ "$version" = 1.0.1 ]; then exit 0; fi
          tag="v$version"
          target=$(git log --first-parent -1 --format=%H -- VERSION)
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$target"
          git show "$target:index.html" | grep -F 'src="./version-badge.js"' >/dev/null
          git show "$target:version-badge.js" | grep -F "const projectVersion = \"$version\";" >/dev/null
          notes=$(mktemp)
          git show "$target:CHANGELOG.md" | awk -v version="$version" '
            /^## / { if (found) exit; found = ($2 == version); next }
            found { print }
          ' > "$notes"
          grep -q '[^[:space:]]' "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes" "${flags[@]}"
